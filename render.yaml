services:
  - type: web
    name: jain-invitation-personalizer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m scripts.render_check
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 16 --backlog 32 --timeout-keep-alive 5 --no-proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14